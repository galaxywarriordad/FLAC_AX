name: Build FLAC_AX Suite

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout FLAC_AX
        uses: actions/checkout@v4

      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake ninja-build pkg-config \
            libflac++-dev libasound2-dev libopenmpt-dev libsdl2-dev libgl1-mesa-dev

      - name: Configure & Build (Release)
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DFLAC_AX_USE_AX_SDK=ON \
            -DFLAC_AX_BUILD_AV_STUDIO=ON \
            -DFLAC_AX_BUILD_VIDEO_UPSCALER=ON \
            -DFLAC_AX_BUILD_APPLIANCE_TUI=ON \
            -DFLAC_AX_ENABLE_OPENMPT=ON \
            -DFLAC_AX_ENABLE_SDL2_GL=ON \
            -DFLAC_AX_ENABLE_LTO=OFF
          ninja -C build -j 4

      - name: Verify Built Binaries
        run: |
          test -x build/flac_ax
          test -x build/ax_av_studio
          test -x build/ax_video_upscaler
          test -x build/ax_appliance_tui
