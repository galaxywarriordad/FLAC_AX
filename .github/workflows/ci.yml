name: Build FLAC_AX Suite

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout FLAC_AX
        uses: actions/checkout@v5

      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            clang lld cmake ninja-build pkg-config \
            libflac++-dev libasound2-dev libopenmpt-dev libsdl2-dev libgl1-mesa-dev \
            liblilv-dev lv2-dev

      - name: Configure & Build (Release, Clang)
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_C_COMPILER=clang \
            -DCMAKE_CXX_COMPILER=clang++ \
            -DCMAKE_BUILD_TYPE=Release \
            -DFLAC_AX_USE_AX_SDK=ON \
            -DFLAC_AX_BUILD_STUDIO=ON \
            -DFLAC_AX_BUILD_UPSCALER=ON \
            -DFLAC_AX_BUILD_APPLIANCE_TUI=ON \
            -DFLAC_AX_BUILD_ENCODE_2GO=ON \
            -DFLAC_AX_BUILD_LV2_HOST=ON \
            -DFLAC_AX_BUILD_CLAP_HOST=ON \
            -DFLAC_AX_ENABLE_NATIVE_OPT=ON \
            -DFLAC_AX_ENABLE_LTO=OFF
          ninja -C build -j 4

      - name: Verify Built Binaries
        run: |
          test -x build/flac_ax
          test -x build/ax_av_studio
          test -x build/ax_video_upscaler
          test -x build/ax_appliance_tui
          if [ -e build/ax_lv2_host ]; then test -x build/ax_lv2_host; fi
          if [ -e build/ax_clap_host ]; then test -x build/ax_clap_host; fi
